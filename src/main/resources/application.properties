spring.application.name=colegio-sapiens-sprint1
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/colegio_sapiens;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false

app.bootstrap.username=${ADMIN_USER:admin}
app.bootstrap.password=${ADMIN_PASSWORD:Admin123!}
app.bootstrap.name=${ADMIN_NAME:Administrador do Sistema}